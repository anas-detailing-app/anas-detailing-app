<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookings Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15171c;
    --panel: #1d2026;
    --panel-2: #262a32;
    --line: #33373f;
    --text: #f2f1ec;
    --muted: #9298a1;
    --accent: #e8b23d;
    --pending: #d9a23f;
    --confirmed: #4fae7a;
    --done: #6c7280;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  #gate{
    max-width: 360px;
    margin: 18vh auto 0;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align:center;
  }
  #gate h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; margin: 0 0 6px; }
  #gate p{ color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  #gate input{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 12px;
    color: var(--text);
    font-size:15px;
    margin-bottom: 12px;
    outline:none;
  }
  #gate button, .refresh-btn{
    width:100%;
    background: var(--accent);
    color:#1a1500;
    border:none;
    border-radius:9px;
    padding:12px;
    font-weight:700;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
  }
  #gateErr{ color:#d9694f; font-size:13px; margin-top:8px; display:none; }

  #app{ display:none; max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; gap:12px; flex-wrap: wrap; }
  h2{ font-family:'Space Grotesk',sans-serif; font-size: 24px; margin:0; }
  .refresh-btn{ width:auto; padding: 10px 18px; }
  .summary{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; flex:1; min-width:120px; }
  .stat .num{ font-family:'Space Grotesk',sans-serif; font-size:22px; }
  .stat .label{ color:var(--muted); font-size:12px; }
  .booking{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .booking-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .booking-top .who{ font-weight:600; font-size:16px; }
  .booking-top .when{ color: var(--muted); font-size:13px; }
  .badge{
    font-size:12px; font-weight:600; padding: 4px 10px; border-radius: 20px;
  }
  .badge.pending{ background: rgba(217,162,63,.15); color: var(--pending); }
  .badge.confirmed{ background: rgba(79,174,122,.15); color: var(--confirmed); }
  .badge.done{ background: rgba(108,114,128,.15); color: var(--done); }
  .details{ margin-top:10px; color: var(--muted); font-size: 14px; line-height:1.6; }
  .details b{ color: var(--text); }
  .actions{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .actions button{
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--text);
    border-radius:8px;
    padding: 7px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .actions button:hover{ border-color: var(--accent); }
  #empty{ color: var(--muted); text-align:center; padding: 40px 0; }

  .section-title{ font-family:'Space Grotesk',sans-serif; font-size:18px; margin: 28px 0 12px; }
  .services-box{ background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .service-row{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  .service-row input{
    background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; color:var(--text); font-size:14px; outline:none;
  }
  .service-row input.name-input{ flex:2; }
  .service-row input.price-input{ flex:1; }
  .service-row button{
    background: var(--panel-2); border:1px solid var(--line); color:var(--danger);
    border-radius:8px; padding:8px 10px; cursor:pointer; font-size:13px;
  }
  .services-actions{ display:flex; gap:10px; margin-top:10px; }
  .services-actions button{
    background: var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer;
  }
  .services-actions .save-btn{ background: var(--accent); color:#1a1500; border:none; font-weight:700; }
  #servicesSavedMsg{ color: var(--confirmed); font-size:13px; margin-top:8px; display:none; }
</style>
</head>
<body>

<div id="gate">
  <h1>Owner Dashboard</h1>
  <p>Enter your access code to view bookings</p>
  <input type="password" id="pin" placeholder="Access code" />
  <button onclick="checkPin()">Enter</button>
  <div id="gateErr">Wrong code, try again.</div>
</div>

<div id="app">
  <div class="top">
    <h2>Dashboard</h2>
    <button class="refresh-btn" onclick="loadBookings()">Refresh</button>
  </div>

  <div class="section-title">Your services & prices</div>
  <div class="services-box">
    <div id="servicesList"></div>
    <div class="services-actions">
      <button onclick="addServiceRow()">+ Add service</button>
      <button class="save-btn" onclick="saveServices()">Save changes</button>
    </div>
    <div id="servicesSavedMsg">Saved! Your booking page now shows these services.</div>
  </div>

  <div class="section-title" style="margin-top:28px;">Your bookings</div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <div id="empty" style="display:none;">No bookings yet. Once someone books, it'll show up here.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function checkPin(){
    const pin = document.getElementById('pin').value;
    if(pin === DASHBOARD_PIN){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadBookings();
      loadServices();
    } else {
      document.getElementById('gateErr').style.display = 'block';
    }
  }

  async function loadBookings(){
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*')
      .order('created_at', { ascending: false });

    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');

    if(error){
      list.innerHTML = '<p style="color:#d9694f">Could not load bookings: ' + error.message + '</p>';
      return;
    }

    if(!data || data.length === 0){
      list.innerHTML = '';
      empty.style.display = 'block';
      summary.innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    const pending = data.filter(b => b.status === 'pending').length;
    const confirmed = data.filter(b => b.status === 'confirmed').length;
    const done = data.filter(b => b.status === 'done').length;

    summary.innerHTML = `
      <div class="stat"><div class="num">${data.length}</div><div class="label">Total bookings</div></div>
      <div class="stat"><div class="num">${pending}</div><div class="label">Pending</div></div>
      <div class="stat"><div class="num">${confirmed}</div><div class="label">Confirmed</div></div>
      <div class="stat"><div class="num">${done}</div><div class="label">Completed</div></div>
    `;

    list.innerHTML = data.map(b => `
      <div class="booking">
        <div class="booking-top">
          <div>
            <div class="who">${b.name} — ${b.car_model}</div>
            <div class="when">${b.preferred_date} at ${b.preferred_time}</div>
          </div>
          <span class="badge ${b.status}">${b.status}</span>
        </div>
        <div class="details">
          <div><b>Service:</b> ${b.service}</div>
          <div><b>Phone:</b> ${b.phone}</div>
          <div><b>Address:</b> ${b.address}</div>
          ${b.notes ? `<div><b>Notes:</b> ${b.notes}</div>` : ''}
        </div>
        <div class="actions">
          ${b.status !== 'confirmed' ? `<button onclick="updateStatus('${b.id}','confirmed')">Mark confirmed</button>` : ''}
          ${b.status !== 'done' ? `<button onclick="updateStatus('${b.id}','done')">Mark done</button>` : ''}
          ${b.status !== 'pending' ? `<button onclick="updateStatus('${b.id}','pending')">Mark pending</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(id, status){
    await supabaseClient.from('bookings').update({ status }).eq('id', id);
    loadBookings();
  }

  function renderServicesList(services){
    const container = document.getElementById('servicesList');
    container.innerHTML = services.map((s, i) => `
      <div class="service-row" data-index="${i}">
        <input class="name-input" value="${s.name}" placeholder="Service name" />
        <input class="price-input" value="${s.price}" placeholder="$0" />
        <button onclick="removeServiceRow(${i})">Remove</button>
      </div>
    `).join('');
  }

  let currentServices = [];

  async function loadServices(){
    const { data, error } = await supabaseClient
      .from('settings')
      .select('services')
      .eq('id', 1)
      .single();

    currentServices = (!error && data && data.services) ? data.services : [];
    renderServicesList(currentServices);
  }

  function addServiceRow(){
    readServicesFromInputs();
    currentServices.push({ name: '', price: '' });
    renderServicesList(currentServices);
  }

  function removeServiceRow(i){
    readServicesFromInputs();
    currentServices.splice(i, 1);
    renderServicesList(currentServices);
  }

  function readServicesFromInputs(){
    const rows = document.querySelectorAll('.service-row');
    currentServices = Array.from(rows).map(row => ({
      name: row.querySelector('.name-input').value.trim(),
      price: row.querySelector('.price-input').value.trim()
    }));
  }

  async function saveServices(){
    readServicesFromInputs();
    const cleaned = currentServices.filter(s => s.name && s.price);
    await supabaseClient.from('settings').update({ services: cleaned }).eq('id', 1);
    currentServices = cleaned;
    renderServicesList(currentServices);
    const msg = document.getElementById('servicesSavedMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  }

  document.getElementById('pin').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPin();
  });
</script>

</body>
</html>
